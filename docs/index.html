<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT Threat Map - QiAnxin Threat Intelligence</title>
  <meta name="description" content="Interactive APT threat group map visualization based on QiAnxin Threat Intelligence data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/topojson.v3.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
          <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
      </div>
      <div>
        <h1>APT Threat Intelligence Map</h1>
        <div class="header-subtitle">Data sourced from QiAnxin Threat Intelligence Center</div>
      </div>
    </div>
    <div class="header-stats" id="stats"></div>
  </header>

  <!-- Tab Navigation -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="map">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Map
    </button>
    <button class="tab-btn" data-tab="stats">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
      Statistics
    </button>
    <button class="tab-btn" data-tab="timeline">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="8 6 3 12 8 18"/></svg>
      Timeline
    </button>
    <button class="tab-btn" data-tab="news">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><line x1="10" y1="6" x2="18" y2="6"/><line x1="10" y1="10" x2="18" y2="10"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
      News Feed
    </button>
  </nav>

  <!-- Main Layout -->
  <div class="main-container">

    <!-- Map View -->
    <section class="map-section tab-content active" id="tab-map">
      <div class="map-container" id="world-map"></div>
      <div class="map-legend" id="map-legend"></div>
      <div class="map-controls">
        <button class="map-ctrl-btn" id="zoom-in" title="Zoom in">+</button>
        <button class="map-ctrl-btn" id="zoom-out" title="Zoom out">&minus;</button>
        <button class="map-ctrl-btn" id="zoom-reset" title="Reset view">&#8634;</button>
      </div>
    </section>

    <!-- Stats View -->
    <section class="stats-section tab-content" id="tab-stats">
      <div class="stats-dashboard">
        <div class="stats-row">
          <div class="chart-card">
            <div class="chart-title">Groups by Origin Country</div>
            <div class="chart-container" id="chart-origins"></div>
          </div>
          <div class="chart-card">
            <div class="chart-title">Threat Level Distribution</div>
            <div class="chart-container" id="chart-threats"></div>
          </div>
        </div>
        <div class="stats-row">
          <div class="chart-card">
            <div class="chart-title">Top Target Sectors</div>
            <div class="chart-container" id="chart-sectors"></div>
          </div>
          <div class="chart-card">
            <div class="chart-title">Top Malware Families</div>
            <div class="chart-container" id="chart-malware"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Timeline View -->
    <section class="timeline-section tab-content" id="tab-timeline">
      <div class="timeline-container" id="timeline-container"></div>
    </section>

    <!-- News View -->
    <section class="news-section tab-content" id="tab-news">
      <div class="news-container" id="news-container">
        <div class="loading"><div class="loading-spinner"></div> Loading threat intelligence news...</div>
      </div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <input type="text" class="search-box" id="search-input" placeholder="Search groups, malware, targets...">
        <div class="filter-row">
          <button class="filter-btn active" data-filter="all">All</button>
        </div>
      </div>
      <div class="apt-list" id="apt-list">
        <div class="loading"><div class="loading-spinner"></div> Loading...</div>
      </div>
    </aside>

  </div>

  <!-- Detail Panel -->
  <div class="detail-panel" id="detail-panel"></div>
  <div class="overlay-dimmer" id="overlay-dimmer" onclick="closeDetail()"></div>

  <!-- Tooltip -->
  <div class="map-tooltip" id="map-tooltip"></div>

  <script src="js/app.js"></script>
</body>
</html>
