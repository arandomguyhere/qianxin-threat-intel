<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT Threat Map - QiAnxin Threat Intelligence</title>
  <meta name="description" content="Interactive APT threat group map visualization based on QiAnxin Threat Intelligence data. Track advanced persistent threat groups worldwide.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">TI</div>
      <div>
        <h1>APT Threat Intelligence Map</h1>
        <div class="header-subtitle">Data sourced from QiAnxin Threat Intelligence Center</div>
      </div>
    </div>
    <div class="header-stats" id="stats">
      <div class="loading"><div class="loading-spinner"></div></div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="main-container">

    <!-- Map -->
    <section class="map-section">
      <div class="map-container" id="world-map">
        <div class="loading"><div class="loading-spinner"></div> Loading threat map...</div>
      </div>
      <div class="map-overlay" id="map-legend"></div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <input type="text" class="search-box" id="search-input" placeholder="Search APT groups, malware, targets...">
        <div class="filter-row">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="Russia">Russia</button>
          <button class="filter-btn" data-filter="China">China</button>
          <button class="filter-btn" data-filter="North Korea">N. Korea</button>
          <button class="filter-btn" data-filter="Iran">Iran</button>
          <button class="filter-btn" data-filter="India">India</button>
          <button class="filter-btn" data-filter="United States">USA</button>
          <button class="filter-btn" data-filter="Vietnam">Vietnam</button>
        </div>
      </div>
      <div class="apt-list" id="apt-list">
        <div class="loading"><div class="loading-spinner"></div> Loading groups...</div>
      </div>
    </aside>

  </div>

  <!-- Detail Panel (slides in from right) -->
  <div class="detail-panel" id="detail-panel"></div>
  <div class="overlay-dimmer" id="overlay-dimmer" onclick="closeDetail()"></div>

  <script src="js/app.js"></script>
</body>
</html>
